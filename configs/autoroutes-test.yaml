daemon:
  pid_file: /var/run/mutiauk.pid

tun:
  name: tun0
  mtu: 1400
  address: 10.200.200.1/24

socks5:
  # Connect to host's Muti Metroo SOCKS5 port
  server: host.docker.internal:1080
  timeout: 30s

routes:
  # No static routes - rely on autoroutes
  []

autoroutes:
  # Routes, mesh hosts, and DNS suffixes are pushed by the agent over the
  # SOCKS5 endpoint above (route-watch); no separate API URL or token.
  enabled: true

nat:
  tcp_timeout: 1h
  udp_timeout: 5m

logging:
  level: debug
  format: console
