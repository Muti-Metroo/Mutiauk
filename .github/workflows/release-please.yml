name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # Every target is cross-compiled from Linux with CGO disabled. The
    # Windows builds embed the Wintun DLL via go:embed (internal/tun), so a
    # plain GOOS=windows build is self-contained.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe

    env:
      BINARY_NAME: mutiauk-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      # go.mod pins go 1.25.x. gVisor does not compile on Go 1.26, so the
      # toolchain must come from go.mod rather than a floating version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go version
          VERSION=${{ needs.release-please.outputs.tag_name }}
          VERSION=${VERSION#v}
          go build -trimpath \
            -ldflags="-s -w -X github.com/Muti-Metroo/Mutiauk/internal/cli.Version=$VERSION" \
            -o "$BINARY_NAME" \
            ./cmd/mutiauk

      # UPX only for Linux. Windows EXEs packed with UPX get flagged by
      # antivirus, and UPX-packed macOS binaries do not run on recent macOS.
      - name: Install UPX
        if: ${{ matrix.goos == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Compress with UPX
        if: ${{ matrix.goos == 'linux' }}
        run: |
          upx --best --lzma "$BINARY_NAME" || echo "UPX compression failed"

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$BINARY_NAME" --clobber

  checksums:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      # The mutiauk-* pattern covers every platform asset, including the
      # Windows .exe files.
      - name: Download all binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.release-please.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "mutiauk-*"

      - name: Create checksums
        run: sha256sum mutiauk-* > checksums.txt

      - name: Upload checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" checksums.txt \
            --repo "${{ github.repository }}" --clobber
