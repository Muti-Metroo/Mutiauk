name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # gVisor requires the Go version in go.mod; use the latest patch of it.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -timeout 15m ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # vet as well as build, so platform-specific files (_darwin.go,
      # _windows.go) are checked too.
      - name: go build and vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

  # TCP, UDP, and ICMP through the TUN against real Muti Metroo agents built
  # from the agent's master branch (test/tun-e2e).
  tun-e2e:
    name: TUN end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Mutiauk

      - uses: actions/checkout@v4
        with:
          repository: Muti-Metroo/Muti-Metroo
          ref: master
          path: Muti-Metroo

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            Mutiauk/go.sum
            Muti-Metroo/go.sum

      - name: Run TUN end-to-end test
        run: Mutiauk/test/tun-e2e/run.sh
